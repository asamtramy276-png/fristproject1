<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      مدارس الكمال ترند لينك الصناعية (K Link) | نظام الإدارة المدرسية
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- شاشة تسجيل الدخول المؤمّنة -->
    <section id="login-view" class="login-wrapper">
      <div class="login-card">
        <div class="brand-header">
          <div class="logo-ring">
            <img
              src="assets/school-logo.svg"
              alt="شعار مدارس الكمال ترند لينك الصناعية"
            />
          </div>
          <h1>مدارس الكمال ترند لينك الصناعية</h1>
          <p class="subtitle">
            بوابة الدخول الموحدة والمؤمّنة بالكامل — K Link
          </p>
          <span class="security-badge">حماية مشفرة وتحقق صارم من الهوية</span>
        </div>

        <div
          class="role-switch"
          role="tablist"
          aria-label="اختر صفة الدخول إلى النظام"
        >
          <button
            type="button"
            class="role-btn active"
            data-role="student"
            role="tab"
            aria-selected="true"
          >
            <span>طالب / ولي أمر</span>
          </button>
          <button
            type="button"
            class="role-btn"
            data-role="trainer"
            role="tab"
            aria-selected="false"
          >
            <span>مدرب / مهندس</span>
          </button>
          <button
            type="button"
            class="role-btn"
            data-role="admin"
            role="tab"
            aria-selected="false"
          >
            <span>الإدارة</span>
          </button>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="full-name">الاسم الكامل المسجل</label>
            <input
              type="text"
              id="full-name"
              name="fullName"
              placeholder="أدخل الاسم بالكامل كما هو مسجل بالمدرسة"
              autocomplete="off"
              required
            />
          </div>

          <div class="form-group">
            <label for="national-id">الرقم القومي (14 رقماً)</label>
            <div class="input-icon-wrap">
              <input
                type="password"
                id="national-id"
                name="nationalId"
                inputmode="numeric"
                maxlength="14"
                placeholder="أدخل الرقم القومي المكون من 14 رقماً"
                autocomplete="off"
                required
              />
              <button
                type="button"
                id="toggle-nid"
                class="eye-btn"
                title="إظهار أو إخفاء الرقم القومي"
                aria-label="إظهار أو إخفاء الرقم القومي"
              >
                عرض
              </button>
            </div>
          </div>

          <div class="form-group" id="grade-group">
            <label for="grade-select">الصف الدراسي</label>
            <select id="grade-select" name="grade">
              <option value="الصف الأول الثانوي الصناعي">
                الصف الأول الثانوي الصناعي
              </option>
              <option value="الصف الثاني الثانوي الصناعي">
                الصف الثاني الثانوي الصناعي
              </option>
              <option value="الصف الثالث الثانوي الصناعي">
                الصف الثالث الثانوي الصناعي
              </option>
            </select>
          </div>

          <div id="login-error" class="error-box hidden" role="alert"></div>

          <button type="submit" class="btn-primary btn-block">
            تسجيل الدخول الآمن
          </button>
        </form>

        <footer class="login-footer">
          جميع البيانات محمية وفق سياسة أمن المعلومات بمدارس الكمال ترند لينك
          الصناعية
        </footer>
      </div>
    </section>

    <!-- التطبيق الرئيسي بعد تسجيل الدخول -->
    <div id="app-view" class="app-shell hidden">
      <header class="topbar">
        <div class="topbar-brand">
          <img
            src="assets/school-logo.svg"
            alt="شعار المدرسة"
            class="topbar-logo"
          />
          <div>
            <div class="topbar-title">
              مدارس الكمال ترند لينك الصناعية (K Link)
            </div>
            <div id="topbar-subtitle" class="topbar-sub">
              نظام الإدارة المدرسية
            </div>
          </div>
        </div>

        <div class="topbar-user">
          <div class="user-meta">
            <strong id="current-user-name">---</strong>
            <span id="current-user-role">---</span>
          </div>
          <button type="button" id="logout-btn" class="btn-danger">خروج</button>
        </div>
      </header>

      <main id="main-content" class="container"></main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
